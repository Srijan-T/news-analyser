<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Analyser</title>
    <script>
      // Set the theme before first paint so dark-mode users never see a white flash.
      // Mirrors src/lib/theme.ts (storage key 'theme'; 'light' | 'dark', else follow the OS).
      // Only the storage read is guarded: if storage is blocked, still follow the OS.
      var t = null
      try {
        t = localStorage.getItem('theme')
      } catch (e) {}
      var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
