# Local Postgres for development and tests: `docker compose up -d`.
# Port 5433 on the host, so it doesn't clash with a Postgres already installed on 5432.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: news_analyser
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database on first start.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d news_analyser"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
